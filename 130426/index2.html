<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de QR</title>
</head>
<body>
    <header>
        <h1>Generador de QR</h1>
    </header>
    <div>
        <label for="nombre">Ingrese el texto para generar el QR:</label>
        <input type="text" id="nombre" placeholder="Ingrese su nombre" required maxlength="100">
        <br>
        <label for="email">Ingrese su correo electrónico:</label>
        <input type="email" id="email" placeholder="Ingrese su correo electrónico" required maxlength="150">
        <br>
        <label for="telefono">Ingrese su número de teléfono:</label>
        <input type="tel" id="telefono" placeholder="Ingrese su número de teléfono" required maxlength="100">   
        
        <br>
        <label for="Institucion">Seleccione su institución:</label>
        <input type="text" id="Institucion" placeholder="Ingrese su institución" required maxlength="100" list="instituciones">
        <datalist id="instituciones">
            <option value="Universidad Nacional Autónoma de México">
            <option value="Instituto de Oaxaca">
            <option value="Instituto Tecnológico de Oaxaca">
            <option value="Universidad del Valle de Oaxaca">
        </datalist>
        <br>
        

    </div>
    <div style="text-align: center;" id="qr">
    <button onclick="generarQR()">Generar QR</button>
    

</div>
    
</body>
<script src="app2.js"></script>
</html>
